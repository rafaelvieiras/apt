name: Publish

# Checks upstream every 6 hours. Does nothing, and costs nothing, when upstream has not moved.
# The landing site (site/, Astro) is rebuilt and uploaded after the packages, but only when
# something changed that it shows: new packages, a push that touches the site or the code,
# or a manual run with force_site / force_index.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Only this package (empty = all)"
        required: false
        default: ""
      force_index:
        description: "Re-render and re-sign the index even if nothing changed"
        type: boolean
        default: false
      force_site:
        description: "Rebuild and upload the landing site even if no package changed"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["packages/**", "repo.toml", "keys/**", "aptrepo/**", "site/**"]

# One publish at a time: two runs would race on index.json.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Stays idle until the R2 bucket is configured (docs/setup.md).
    if: vars.R2_BUCKET != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m aptrepo check
          python -m unittest discover -s tests -t .
      - name: Publish
        id: publish
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          PACKAGE: ${{ github.event.inputs.package }}
          FORCE_INDEX: ${{ github.event.inputs.force_index }}
        run: |
          args=(publish --storage r2)
          [ "$FORCE_INDEX" = "true" ] && args+=(--force-index)
          [ -n "$PACKAGE" ] && args+=("$PACKAGE")
          set +e
          python -m aptrepo "${args[@]}" | tee "$RUNNER_TEMP/publish.log"
          status=${PIPESTATUS[0]}
          set -e
          # The last line is "published=N skipped=N errors=N". Export N so the site step can decide.
          echo "published=$(sed -n 's/^published=\([0-9]*\) .*/\1/p' "$RUNNER_TEMP/publish.log" | tail -1)" >> "$GITHUB_OUTPUT"
          exit "$status"

      # Decide whether the landing site needs a rebuild. It does when packages were published
      # (it shows them), and also when the push touched the site or the code even though no
      # package changed: a redesign must go live without forcing the index.
      - name: Decide on the site
        id: gate
        if: ${{ !cancelled() && steps.publish.outputs.published != '' }}
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
          EVENT: ${{ github.event_name }}
          FORCE_SITE: ${{ github.event.inputs.force_site }}
          FORCE_INDEX: ${{ github.event.inputs.force_index }}
        run: |
          if [ "$PUBLISHED" != "0" ] || [ "$EVENT" = "push" ] || [ "$FORCE_SITE" = "true" ] || [ "$FORCE_INDEX" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Landing site unchanged: nothing published and no site change."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && steps.gate.outputs.build == 'true' }}
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Exports site-data.json from the published index.json, runs `npm ci && npm run build`
      # in site/ and uploads site/dist/ (refuses apt paths and sample-data builds).
      - name: Build and upload the site
        if: ${{ !cancelled() && steps.gate.outputs.build == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          PYTHONUNBUFFERED: "1"
        run: python -m aptrepo publish-site --storage r2
