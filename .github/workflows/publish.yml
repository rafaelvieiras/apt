name: Publish

# Checks upstream every 6 hours. Does nothing, and costs nothing, when upstream has not moved.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Only this package (empty = all)"
        required: false
        default: ""
      force_index:
        description: "Re-render and re-sign the index even if nothing changed"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["packages/**", "repo.toml", "keys/**", "aptrepo/**"]

# One publish at a time: two runs would race on index.json.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Stays idle until the R2 bucket is configured (docs/setup.md).
    if: vars.R2_BUCKET != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m aptrepo check
          python -m unittest discover -s tests -t .
      - name: Publish
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ github.event.inputs.package }}
          FORCE_INDEX: ${{ github.event.inputs.force_index }}
        run: |
          args=(publish --storage r2)
          [ "$FORCE_INDEX" = "true" ] && args+=(--force-index)
          [ -n "$PACKAGE" ] && args+=("$PACKAGE")
          python -m aptrepo "${args[@]}"
