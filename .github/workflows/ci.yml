name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate recipes and licences
        run: python -m aptrepo check
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  # The landing site must always build, against sample data (no R2, no secrets).
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build against sample data
        env:
          SITE_DATA: src/data/sample.json
        run: npm run build
      - name: Check the output
        run: |
          test -s dist/index.html
          test -s dist/packages.html
          if grep -hoE '<(script|link|img)[^>]+(src|href)="https?://[^"]*"' dist/*.html | grep -v 'rel="canonical"'; then
            echo "external resource in the built site" >&2
            exit 1
          fi
